# GitHub Actions workflow: build and run the test suite on every push and pull request.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev valgrind lcov

      - name: Build (Release)
        run: ./manage.sh build

      - name: Unit tests with ASAN
        run: ./manage.sh test
